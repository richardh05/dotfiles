[opener]
drag = [
	{ run = "dragon-drop %s",    desc = "Drag & Drop", for = "linux" },
]

[open]
rules = [
	# Folder
	{ url = "*/", use = [ "open", "reveal", "drag" ] },
	# Text
	{ mime = "text/*", use = [ "open", "reveal", "drag" ] },
	# Image
	{ mime = "image/*", use = [ "open", "reveal", "drag" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "reveal", "drag" ] },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal", "drag" ] },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", use = "download" },
	# Fallback
	{ url = "*", use = [ "open", "reveal", "drag" ] },
]

